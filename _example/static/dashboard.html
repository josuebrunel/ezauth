<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EzAuth Example</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .container { max-width: 600px; margin-top: 50px; }
    </style>
</head>
<body>
    <main class="container">
        <article>
            <header>Dashboard</header>
            <h3 id="welcomeMsg">Welcome!</h3>
            <p>You are successfully logged in.</p>
            <pre id="userInfo">Loading...</pre>
            <footer>
                <button id="logoutBtn" class="secondary">Logout</button>
            </footer>
        </article>
    </main>
    <script>
        const accessToken = localStorage.getItem('access_token');
        const refreshToken = localStorage.getItem('refresh_token');

        if (!accessToken) {
            window.location.href = '/login.html';
        }

        async function fetchUserInfo() {
            try {
                const response = await fetch('/auth/userinfo', {
                    headers: {
                        'Authorization': 'Bearer ' + accessToken,
                        'X-API-Key': 'my-super-secret-api-key'
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    const user = result.data;
                    document.getElementById('welcomeMsg').textContent = 'Welcome, ' + user.email;
                    document.getElementById('userInfo').textContent = JSON.stringify(user, null, 2);
                } else {
                    // Token might be expired or invalid
                    console.error('Failed to fetch user info', await response.text());
                    // Simple example: logout
                    localStorage.removeItem('access_token');
                    localStorage.removeItem('refresh_token');
                    window.location.href = '/login.html';
                }
            } catch (err) {
                console.error(err);
            }
        }

        if (accessToken) {
            fetchUserInfo();
        }

        document.getElementById('logoutBtn').addEventListener('click', async () => {
             try {
                if (refreshToken) {
                    await fetch('/auth/logout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + accessToken,
                            'X-API-Key': 'my-super-secret-api-key'
                        },
                        body: JSON.stringify({ refresh_token: refreshToken })
                    });
                }
            } catch (err) {
                console.error('Logout error', err);
            } finally {
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
                window.location.href = '/login.html';
            }
        });
    </script>
</body>
</html>
