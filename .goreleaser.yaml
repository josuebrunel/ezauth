# This is a GoReleaser configuration file.
# It is used to automate the build and release process for Go projects.
# For more information, see https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/ezauthapi/main.go
    binary: ezauthapi

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

release:
  header: |
    ## Highlights

    The released `ezauthapi` binary can now fully bootstrap itself — no
    second binary, no building from source just to run a migration:

    - **`ezauthapi migrate <up|down|revert>`** — run migrations as their
      own step, separate from starting the server. `revert` is new: rolls
      back only the single most recently applied migration, instead of
      `down`'s full reset to an empty schema. Optional `-dialect`/`-dsn`/
      `-schema` flags override the `EZAUTH_DB_*` env vars for one
      invocation, e.g. to target a different database.
    - **`ezauthapi create-admin -email=... -password=...`** — bootstraps
      an admin-capable user: creates the account if needed, grants it an
      RBAC role (`-role`, defaults to `admin`) so it actually passes
      `RequireRole`-gated routes. Idempotent — safe to run on every
      container boot.
    - **Removed `cmd/migrate`** — it was never part of a release archive
      to begin with; `ezauthapi migrate` fully replaces it.

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
