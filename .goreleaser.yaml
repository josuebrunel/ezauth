# This is a GoReleaser configuration file.
# It is used to automate the build and release process for Go projects.
# For more information, see https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/ezauthapi/main.go
    binary: ezauthapi

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

release:
  header: |
    ## Highlights

    RBAC, Organizations, and API Keys (v0.20.0) were previously Go-only —
    this release completes the HTTP layer for all three, plus two bug
    fixes caught while verifying it and a log-level propagation fix:

    - **Standalone-service endpoints** — `/auth/api/admin/roles`,
      `/permissions`, `/organizations`, and self-service `/auth/api/api-keys`
      now exist in both JSON and form-based (cookie) modes, matching every
      other admin-style feature.
    - **Fix: Form-mode body parsing** — the new Form handlers were
      JSON-decoding request bodies instead of parsing
      `application/x-www-form-urlencoded` like every other Form handler;
      a real browser `<form>` submit would have 400'd every time.
    - **Fix: API key list exposure** — listing API keys returned the raw
      key value on every call, not just at creation; it's now redacted
      the same way session listing already redacts refresh tokens.
    - **Fix: log-level propagation** — `NewWithDB` (embedding with an
      existing `*sql.DB`) never applied `cfg.Debug` to the logger; it now
      does, matching `New`.
    - **Docs** — the RBAC/organizations/API-key/reuse-detection docs
      catch-up that follows from actually finishing the feature.

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
