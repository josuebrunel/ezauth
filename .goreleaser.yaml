# This is a GoReleaser configuration file.
# It is used to automate the build and release process for Go projects.
# For more information, see https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/ezauthapi/main.go
    binary: ezauthapi

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

release:
  header: |
    ## Highlights

    This release adds real authorization and multi-tenancy to ezauth,
    plus a security and performance hardening pass:

    - **Refresh-token reuse detection** — replaying an already-rotated-out
      refresh token now revokes its entire token family, a strong signal
      of theft.
    - **Real RBAC** — `ezauth_roles`/`ezauth_permissions` tables and
      `RequireRole`/`RequirePermission` middleware, fully additive
      alongside the existing `User.Roles` string field.
    - **Scoped API keys** — limit a key to specific actions via
      `RequireAPIKeyScope`, instead of full-account access.
    - **Multi-tenancy (Organizations)** — lightweight orgs/teams with
      per-(org, user) roles drawn from the same RBAC catalog.
    - **Hardening** — SQLite foreign-key enforcement (cascades now
      actually fire), bulk session/token-family revocation instead of
      N+1 loops, a new composite token index, configurable DB
      connection-pool limits, and batched MFA recovery-code inserts.

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
