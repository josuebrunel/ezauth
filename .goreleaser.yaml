# This is a GoReleaser configuration file.
# It is used to automate the build and release process for Go projects.
# For more information, see https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/ezauthapi/main.go
    binary: ezauthapi

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

release:
  header: |
    ## Highlights

    The three highest-severity findings from the recent security audit,
    closing it out (see v0.24.0's notes for the other thirteen):

    - **BREAKING: admin/RBAC/org/impersonation routes now deny by
      default** — `AdminUsersList/Suspend/Reactivate`, `RoleCreate/Delete`,
      `UserRoleGrant/Revoke`, `OrganizationCreate/Delete`,
      `OrgMemberAdd/Remove`, `Impersonate/StopImpersonation` (JSON API and
      Form, everywhere `RequireRole`/`RequirePermission` existed but were
      never wired in) were reachable by any authenticated user. `New()` now
      requires the caller hold the RBAC role `Cfg.AdminRole`
      (`EZAUTH_ADMIN_ROLE`, defaults to `"admin"`) on both transports.
      **Action required**: bootstrap your first admin via
      `ezauthapi create-admin` (or `UserRoleGrant` directly) after
      upgrading, or every admin/RBAC/org/impersonation call starts
      returning 401/403. Use `handler.WithAdminAuthz(middleware)` for a
      different scheme (`RequirePermission`, an org-scoped check, your own
      authorization system), or `WithAdminAuthz(nil)` to disable the gate
      and restore the old behavior if you're authorizing this subtree
      yourself in front of ezauth. See #132 and the README's new
      "Admin Authorization" section.
    - **Fix: bearer tokens stored in plaintext at rest** — refresh tokens,
      password-reset/passwordless links, API keys, MFA pre-auth tokens,
      trusted-device tokens, invitations, and email-change links were
      persisted and looked up verbatim (MFA recovery codes and SMS OTP
      codes already followed the safer pattern). All are now stored and
      looked up by SHA-256 hash. A migration hashes existing rows in place
      on postgres/mysql (verified byte-identical to what the app computes
      at runtime, so existing sessions/API keys keep working) — SQLite has
      no built-in SHA-256, so that migration is a documented no-op:
      existing tokens on a SQLite-backed deployment are invalidated by
      upgrading (a full session flush), which only matters for actual
      production use of SQLite specifically. See #133.
    - **Fix: invitations could self-escalate privilege** —
      `InvitationCreate` accepted a caller-supplied `Roles` string with no
      check that the inviter actually held it, and `InvitationAccept`
      wrote it verbatim into the new account. Since ezauth's own documented
      authorization pattern is `caller.HasRole("admin")`, any authenticated
      user could self-invite with `roles:"admin"` and escalate. Rejected
      now (`403`) unless the inviter already holds every requested role.
      See #131.

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
