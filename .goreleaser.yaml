# This is a GoReleaser configuration file.
# It is used to automate the build and release process for Go projects.
# For more information, see https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/ezauthapi/main.go
    binary: ezauthapi

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

release:
  header: |
    ## Highlights

    A review pass turned up five issues, the most serious being a
    password-hashing crash; all are fixed:

    - **Fix: argon2id panicked when configured via environment** — the
      vendored env loader never populated the `uint32`/`uint8` argon2
      parameter fields, so `EZAUTH_HASHING_ALGORITHM=argon2id` panicked on
      the very first password hash. The fields are now `int`, validated
      before hashing, and return an error instead of crashing.
    - **Fix: session/API-key listings were unordered** — `Sessions()` and
      `APIKeysList()` were documented as "most recent first" but the
      underlying query had no `ORDER BY`; now consistently ordered by
      `created_at DESC` across sqlite/postgres/mysql.
    - **Removed dead `EZAUTH_OAUTH2_<PROVIDER>_NAME` config fields** —
      built-in providers are registered under hard-coded names, so these
      env vars never had any effect.
    - **Docs: standalone `pkg/handler/middleware` package** —
      `RateLimiter`, `Chain`, and the standalone middleware constructors
      now have a reference section; they're usable independently of
      `Handler`.
    - Cleanup: fixed a stale comment and removed an unused exported type.

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
