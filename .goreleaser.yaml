# This is a GoReleaser configuration file.
# It is used to automate the build and release process for Go projects.
# For more information, see https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/ezauthapi/main.go
    binary: ezauthapi

archives:
  - format: tar.gz
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      format: zip

release:
  header: |
    ## Highlights

    Security fix, found during a downstream audit:

    - **Fix: session fixation on every login-adjacent path** —
      `setAuthCookies` (the single choke point form login/registration,
      OAuth2 callback, passwordless, WebAuthn, SMS OTP, MFA verify, and
      impersonation-start all funnel through) wrote the session's auth
      tokens without first rotating the session ID. A session ID issued
      before authentication — one an attacker could fix on a victim —
      stayed valid after login and inherited the authenticated session.
      `scs.SessionManager.RenewToken` is now called before the tokens are
      written, closing all of those paths in one place. See #130.

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - 'Merge pull request'
      - 'Merge branch'
