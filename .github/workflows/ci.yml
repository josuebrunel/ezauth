name: Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"

            - name: Check formatting (gofmt)
              run: |
                  fmt_out="$(gofmt -l . | grep -v '^vendor/' || true)"
                  if [ -n "$fmt_out" ]; then
                      echo "The following files are not gofmt-formatted:"
                      echo "$fmt_out"
                      exit 1
                  fi

            - name: Vet
              run: go vet ./...

    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                db:
                    - name: sqlite
                      dialect: sqlite
                      dsn: "file:test.db?mode=memory&cache=shared"
                      race: true
                    - name: postgres
                      dialect: postgres
                      dsn: "postgres://postgres:postgres@localhost:5432/testdb?sslmode=disable"
                      race: false
                    - name: mysql
                      dialect: mysql
                      dsn: "root:mysql@tcp(localhost:3306)/testdb?parseTime=true&multiStatements=true"
                      race: false

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: testdb
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            mysql:
                image: mysql:8
                env:
                    MYSQL_ROOT_PASSWORD: mysql
                    MYSQL_DATABASE: testdb
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"

            - name: Run tests (${{ matrix.db.name }})
              env:
                  EZAUTH_DB_DIALECT: ${{ matrix.db.dialect }}
                  EZAUTH_DB_DSN: ${{ matrix.db.dsn }}
              run: |
                  if [ "${{ matrix.db.race }}" = "true" ]; then
                      go test ./... -p 1 -count=1 -race
                  else
                      go test ./... -p 1 -count=1
                  fi

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version-file: "go.mod"

            - name: Build
              run: |
                  go build -o bin/ezauthapi ./cmd/ezauthapi

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ezauthapi-binary
                  path: bin/ezauthapi
