  protocol.AttestationFormat:
    enum:
    - packed
    - tpm
    - android-key
    - android-safetynet
    - fido-u2f
    - apple
    - compound
    - none
    type: string
    x-enum-varnames:
    - AttestationFormatPacked
    - AttestationFormatTPM
    - AttestationFormatAndroidKey
    - AttestationFormatAndroidSafetyNet
    - AttestationFormatFIDOUniversalSecondFactor
    - AttestationFormatApple
    - AttestationFormatCompound
    - AttestationFormatNone
  protocol.AuthenticationExtensions:
    properties:
      appid:
        description: AppID is the FIDO AppID Extension input. Authentication only.
        type: string
      appidExclude:
        description: AppIDExclude is the FIDO AppID Exclusion Extension input. Registration
          only.
        type: string
      credBlob:
        description: CredBlob is the blob to store with the credential. Registration
          only.
        items:
          type: integer
        type: array
      credProps:
        description: CredProps requests the Credential Properties Extension. Registration
          only.
        type: boolean
      credentialProtectionPolicy:
        allOf:
        - $ref: '#/definitions/protocol.CredentialProtectionPolicy'
        description: CredentialProtectionPolicy is the CTAP credProtect policy. Registration
          only.
      enforceCredentialProtectionPolicy:
        description: EnforceCredentialProtectionPolicy requires the credProtect policy
          is honoured. Registration only.
        type: boolean
      getCredBlob:
        description: GetCredBlob requests the blob stored with the credential. Authentication
          only.
        type: boolean
      hmacCreateSecret:
        description: HMACCreateSecret requests provisioning of the CTAP hmac-secret.
          Registration only.
        type: boolean
      hmacGetSecret:
        allOf:
        - $ref: '#/definitions/protocol.HMACGetSecretInputs'
        description: HMACGetSecret requests evaluation of the CTAP hmac-secret. Authentication
          only.
      largeBlob:
        allOf:
        - $ref: '#/definitions/protocol.LargeBlobInputs'
        description: LargeBlob is the Large blob storage Extension input.
      minPinLength:
        description: MinPinLength requests the authenticator minimum PIN length. Registration
          only.
        type: boolean
      prf:
        allOf:
        - $ref: '#/definitions/protocol.PRFInputs'
        description: |-
          PRF is the Pseudo-random function Extension input. It is a pointer because an empty dictionary is a
          meaningful input for this extension and only this extension: a Relying Party sends "prf":{} at registration
          to ask whether the pseudo-random function is available for the credential being created, and the client
          answers with the 'enabled' output. A value type combined with omitzero cannot express the difference between
          an absent member and a member present but empty, so a non-nil pointer to a zero value is what carries the
          bare availability probe.
      remoteClientDataJSON:
        description: |-
          RemoteClientDataJSON is the Remote Client Data JSON Extension input. This member is set by a remote desktop
          web client and a Relying Party should not normally set it. See [ExtensionRemoteClientDataJSON], which records
          that this extension is not yet ratified.
        type: string
      uvm:
        description: UVM requests the user verification methods used for the operation.
        type: boolean
    type: object
  protocol.AuthenticatorAttachment:
    enum:
    - platform
    - cross-platform
    type: string
    x-enum-varnames:
    - Platform
    - CrossPlatform
  protocol.AuthenticatorSelection:
    properties:
      authenticatorAttachment:
        allOf:
        - $ref: '#/definitions/protocol.AuthenticatorAttachment'
        description: |-
          AuthenticatorAttachment If this member is present, eligible authenticators are filtered to only
          authenticators attached with the specified AuthenticatorAttachment enum.
      requireResidentKey:
        description: |-
          RequireResidentKey this member describes the Relying Party's requirements regarding resident
          credentials. If the parameter is set to true, the authenticator MUST create a client-side-resident
          public key credential source when creating a public key credential.
        type: boolean
      residentKey:
        allOf:
        - $ref: '#/definitions/protocol.ResidentKeyRequirement'
        description: |-
          ResidentKey this member describes the Relying Party's requirements regarding resident
          credentials per Webauthn Level 2.
      userVerification:
        allOf:
        - $ref: '#/definitions/protocol.UserVerificationRequirement'
        description: |-
          UserVerification This member describes the Relying Party's requirements regarding user verification for
          the create() operation. Eligible authenticators are filtered to only those capable of satisfying this
          requirement.
    type: object
